plugins {
    id 'com.android.application'
}

android {
    namespace 'in.kaverisweets.app'
    compileSdk 35

    defaultConfig {
        applicationId 'in.kaverisweets.app'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '1.0.3'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
