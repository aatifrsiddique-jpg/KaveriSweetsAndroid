name: Generate Kaveri Upload Key

on:
  workflow_dispatch:

jobs:
  generate-key:
    runs-on: ubuntu-latest

    steps:

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate upload keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore kaveri-upload-key.jks \
            -alias kaveri-upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "KaveriUpload2026!" \
            -keypass "KaveriUpload2026!" \
            -dname "CN=Kaveri Sweets, OU=Kaveri Sweets, O=Kaveri Sweets, L=Saharanpur, ST=Uttar Pradesh, C=IN"

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: KaveriSweets-upload-keystore
          path: kaveri-upload-key.jks
